<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <!--[if gte mso 9]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <!--[if !mso]><!--><meta http-equiv="X-UA-Compatible" content="IE=edge"><!--<![endif]-->
  <title>{{app_name}}</title>

  <style type="text/css">
    @media only screen and (min-width: 520px) {
      .u-row { width: 500px !important; }
      .u-row .u-col-100 { width: 500px !important; }
    }

    @media only screen and (max-width: 520px) {
      .u-row-container { max-width: 100% !important; padding-left: 0 !important; padding-right: 0 !important; }
      .u-row { width: 100% !important; }
      .u-row .u-col { display: block !important; width: 100% !important; min-width: 320px !important; max-width: 100% !important; }
      .u-row .u-col > div { margin: 0 auto; }
    }

    body { margin:0; padding:0; -webkit-text-size-adjust:100%; background-color:#fff; color:#000000; }
    table, td, tr { border-collapse:collapse; vertical-align:top; }
    p { margin:0; }
    a[x-apple-data-detectors=true] { color:inherit !important; text-decoration:none !important; }
    table, td { color: #000000; }
  </style>
</head>

<body style="margin:0;padding:0;background-color:#fff;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fff;">
    <tr>
      <td align="center">

        <!-- Header / Logo: a small logo top right, no band -->
        <div style="max-width:500px; margin:0 auto; background:#ffffff;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td align="right" style="padding:24px 30px 0 30px;">
                <a href="%%HEADER_LINK%%" target="_blank">
                  <img src="%%MARK_URL%%"
                       alt="%%LOGO_ALT%%" width="%%MARK_WIDTH%%" style="width:%%MARK_WIDTH%%px; max-width:%%MARK_WIDTH%%px; height:auto; border:0;">
                </a>
              </td>
            </tr>
          </table>
        </div>

        <!-- Content -->
        <div style="max-width:500px; margin:0 auto; background:#ffffff;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="padding:30px; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:1.4;">
                {{{content}}}
              </td>
            </tr>
          </table>
        </div>

        <!-- Footer -->
        <div style="max-width:500px; margin:0 auto; background:#ffffff;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td align="center" style="padding:10px; font-family:Arial,Helvetica,sans-serif; font-size:10px; color:#666666;">
                © {{year}} %%FOOTER_NAME%%
                {{#if contact_email}}
                <br>{{contact_email}}
                {{/if}}
              </td>
            </tr>
          </table>
        </div>

      </td>
    </tr>
  </table>
</body>
</html>
