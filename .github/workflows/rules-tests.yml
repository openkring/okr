# M-11 (privacy 1.19 Phase 4): the Firestore/Storage security rules ARE the
# privacy enforcement — run the emulator rules harness on every change that
# touches them, so a loosened rule turns into a red check instead of a leak.
name: rules-tests

on:
  push:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore-rules-tests/**'
      - '.github/workflows/rules-tests.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore-rules-tests/**'
      - '.github/workflows/rules-tests.yml'

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Public core suffices — the harness needs only firestore.rules,
      # storage.rules, firebase.json and firestore-rules-tests/ (no submodules).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The emulator suite runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The test scripts use only the Python standard library.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run Firestore + Storage rules tests
        run: ./firestore-rules-tests/run.sh
